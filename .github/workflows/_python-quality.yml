name: Python Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: careerops_test
          POSTGRES_USER: careerops
          POSTGRES_PASSWORD: careerops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerops -d careerops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.tests
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      TEST_DATABASE_URL: postgresql://careerops:careerops@127.0.0.1:5432/careerops_test
      DATABASE_URL: postgresql://careerops:careerops@127.0.0.1:5432/careerops_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      # Disposable key generated only for this CI run.
      # This is never used by local, staging, or production environments.
      - name: Generate ephemeral Django secret key
        shell: bash
        run: |
          echo "DJANGO_SECRET_KEY=$(uv run python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Type-check Python
        run: uv run mypy

      - name: Run Django checks
        run: |
          uv run python manage.py check --settings=config.settings.tests
          uv run python manage.py makemigrations --check --dry-run --settings=config.settings.tests

      - name: Run deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
        run: >-
          uv run python manage.py check --deploy --fail-level WARNING
          --settings=config.settings.production

      - name: Run tests
        run: uv run pytest
